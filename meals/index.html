<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Meals</title>
  <link rel="icon" href="../favicon.ico">
  <script>
    if (localStorage.theme) document.documentElement.dataset.theme = localStorage.theme;
  </script>
  <style>
    /* Same colors and type as ../index.html; contrast notes live there. */
    :root {
      color-scheme: light dark;
      --bg: light-dark(#fafaf7, #1a1a19);
      --text: light-dark(#0b0b0b, #ecebe6);
      --text-2: light-dark(#52514e, #c3c2b7);
      --muted: light-dark(#5f5e59, #a3a299);
      --rule: light-dark(#dddcd6, #333331);
      --accent: light-dark(#174e9c, #8ab8f2);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0 auto; max-width: 42rem; padding: 4rem 1.25rem 3rem;
      background: var(--bg); color: var(--text);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); text-underline-offset: 2px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0; }
    h2 { font-size: 1rem; margin: 2.5rem 0 .5rem; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    #theme { position: absolute; top: 1rem; right: 1.25rem; font-size: 1.1rem; color: var(--text-2); }
    .note { color: var(--muted); font-size: .85rem; margin: .25rem 0 0; }
    form { margin: 2rem 0; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    input { font: inherit; padding: .3rem .6rem; border: 1px solid var(--rule); border-radius: 6px; background: transparent; color: inherit; }
    form button { padding: .3rem .9rem; border: 1px solid var(--text-2); border-radius: 999px; }
    #err { color: var(--text); font-weight: 500; width: 100%; margin: 0; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th { text-align: left; font-weight: 500; color: var(--muted); font-size: .8rem; padding: 0 0 .35rem; }
    td { padding: .3rem 1rem .3rem 0; border-top: 1px solid var(--rule); vertical-align: top; }
    td:first-child { width: 6.5rem; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
    tr.today td { font-weight: 600; }
    .facts { color: var(--text-2); }
    ul, ol { padding-left: 1.25rem; }
    li { margin: .25rem 0; }
    .amt { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <button id="theme" type="button" aria-label="Theme: system">◐</button>
  <h1>Meals</h1>
  <p class="note" id="updated"></p>

  <form id="login" hidden>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Unlock</button>
    <p id="err" role="alert"></p>
  </form>

  <main id="out"></main>

  <script>
    const themeBtn = document.getElementById("theme");
    const themes = { "": ["◐", "system"], light: ["☀", "light"], dark: ["☾", "dark"] };
    const showTheme = (t) => {
      themeBtn.textContent = themes[t][0];
      themeBtn.setAttribute("aria-label", `Theme: ${themes[t][1]}`);
    };
    showTheme(localStorage.theme || "");
    themeBtn.addEventListener("click", () => {
      const next = { "": "light", light: "dark", dark: "" }[localStorage.theme || ""];
      if (next) localStorage.theme = document.documentElement.dataset.theme = next;
      else { localStorage.removeItem("theme"); delete document.documentElement.dataset.theme; }
      showTheme(next);
    });

    // --- Unlock. Data is made by dinner-hub's scripts/build_site_data.py:
    // PBKDF2-SHA256 key from the password, AES-GCM, all base64.
    const COOKIE = "dinnerhub";
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const unb64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const getCookie = () => document.cookie.split("; ").find((c) => c.startsWith(COOKIE + "="))?.slice(COOKIE.length + 1);
    const setCookie = (v, age) => { document.cookie = `${COOKIE}=${v}; Max-Age=${age}; Path=/meals/; Secure; SameSite=Strict`; };

    async function deriveKey(password, file) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt: b64(file.salt), iterations: file.iter },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }
    async function unlock(key, file) {  // throws on a wrong key
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(file.iv) }, key, b64(file.data));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    // --- Render. Build nodes, never innerHTML, so data can't inject markup.
    const el = (tag, props = {}, ...kids) => {
      const n = Object.assign(document.createElement(tag), props);
      n.append(...kids.flat().filter(Boolean));  // drops false / 0 / "" from `cond && el(...)`
      return n;
    };
    const out = document.getElementById("out");
    let bundle;

    const items = (list) => list.flatMap((it, i) => [
      i ? " + " : "",
      it.recipe && bundle.recipes[it.recipe] ? el("a", { href: "#" + it.recipe }, it.name) : it.name,
    ]);
    const weekTitle = (w) => "Week of " + new Date(w + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    const todayLabel = new Date().toLocaleDateString("en-US", { weekday: "short", month: "2-digit", day: "2-digit" }).replace(",", "");

    function renderWeeks() {
      document.title = "Meals";
      out.replaceChildren(...bundle.weeks.map((w) => {
        const lunch = w.days.some((d) => d.lunch.length);  // hide an all-empty Lunch column
        return el("section", {},
          el("h2", {}, weekTitle(w.week)),
          el("table", {},
            el("thead", {}, el("tr", {}, el("th", {}, "Day"), lunch && el("th", {}, "Lunch"), el("th", {}, "Dinner"))),
            el("tbody", {}, w.days.map((d) => el("tr", { className: d.day === todayLabel ? "today" : "" },
              el("td", {}, d.day), lunch && el("td", {}, items(d.lunch)), el("td", {}, items(d.dinner)))))));
      }));
    }

    function renderRecipe(slug) {
      const r = bundle.recipes[slug];
      const n = r.nutrition;
      document.title = r.name;
      const facts = [r.time_minutes && `${r.time_minutes} min`, r.servings && `serves ${r.servings}`,
        n && `${n.calories} cal · ${n.carbs_g}g carbs · ${n.protein_g}g protein · ${n.fat_g}g fat per serving`].filter(Boolean);
      const sides = (r.sides || []).filter((s) => bundle.recipes[s]);
      const src = r.source && /^https?:\/\//.test(r.source)
        ? el("a", { href: r.source }, new URL(r.source).hostname.replace(/^www\./, "")) : r.source;
      out.replaceChildren(
        el("p", {}, el("a", { href: "#" }, "← All meals")),
        el("h2", { style: "font-size:1.5rem;margin-top:1rem" }, r.name),
        el("p", { className: "facts" }, facts.join(" · ")),
        el("h2", {}, "Ingredients"),
        el("ul", {}, r.ingredients.map((i) => el("li", {},
          el("span", { className: "amt" }, i.amount ?? ""), " ", i.item,
          i.note && el("span", { className: "muted" }, `, ${i.note}`),
          i.option && el("span", { className: "muted" }, ` (${i.option})`)))),
        sides.length && el("p", {}, "Sides: ", sides.flatMap((s, i) => [i ? ", " : "", el("a", { href: "#" + s }, bundle.recipes[s].name)])),
        el("h2", {}, "Instructions"),
        el("ol", {}, r.instructions.map((s) => el("li", {}, s))),
        r.changes.length && el("h2", {}, "Changes"),
        r.changes.length && el("ul", {}, r.changes.map((s) => el("li", {}, s))),
        src && el("p", { className: "note" }, "Source: ", src));
      scrollTo(0, 0);
    }

    const route = () => {
      const slug = decodeURIComponent(location.hash.slice(1));
      bundle.recipes[slug] ? renderRecipe(slug) : renderWeeks();
    };

    function show(data) {
      bundle = data;
      document.getElementById("login").hidden = true;
      document.getElementById("updated").textContent = `Updated ${data.updated}`;
      addEventListener("hashchange", route);
      route();
    }

    (async () => {
      let file;
      try {
        file = await (await fetch("../data/dinner-hub.enc.json", { cache: "no-cache" })).json();
      } catch {
        return out.replaceChildren(el("p", {}, "No meal data yet."));
      }
      const saved = getCookie();
      if (saved) {
        let data;
        try {
          const key = await crypto.subtle.importKey("raw", b64(decodeURIComponent(saved)), "AES-GCM", false, ["decrypt"]);
          data = await unlock(key, file);
        } catch { setCookie("", 0); }  // stale key (password changed): log out
        if (data) return show(data);
      }
      const form = document.getElementById("login");
      form.hidden = false;
      document.getElementById("pw").focus();
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const err = document.getElementById("err");
        err.textContent = "Checking…";
        let key, data;
        try {
          key = await deriveKey(document.getElementById("pw").value, file);
          data = await unlock(key, file);
        } catch { return err.textContent = "Wrong password"; }
        setCookie(encodeURIComponent(unb64(await crypto.subtle.exportKey("raw", key))), 60 * 60 * 24 * 30);
        show(data);
      });
    })();
  </script>
</body>
</html>
