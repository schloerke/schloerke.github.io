on:
  schedule:
    # Daily at 06:17 UTC (~1am US Central). Off the hour because GitHub
    # delays or drops scheduled runs when many workflows start at :00.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - run: make data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild the CV PDF from the fresh data. Same typst as local builds, and only the fonts in
      # cv/fonts, so the PDF's bytes change only when its content does; git diff below decides.
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.13.1
      - run: make cv

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add data cv/cv_barret_schloerke.pdf
          git diff --cached --quiet || (git commit -m "Refresh data" && git push)

  # GitHub disables scheduled workflows after 60 days without repo activity,
  # and bot commits don't count. Re-enabling resets the timer. (Same call
  # gautamkrishnar/keepalive-workflow made; that repo is now blocked.)
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail loudly once a year so a human confirms this is still wanted.
      # Bump the date to keep going.
      - run: |
          if [[ "$(date -u +%F)" > "2027-10-01" ]]; then
            echo "::error::Keepalive expired. Bump the date in .github/workflows/data.yml."
            exit 1
          fi
