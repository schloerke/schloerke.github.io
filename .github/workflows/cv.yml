# Build the CV and resume PDFs on every PR, so a broken cv.typ / resume.typ / cv.json, or a
# resume that outgrew one page, fails here instead of in the weekly rebuild.
# Nothing is committed. `build` is a required check on main (repo ruleset), so it has no
# `paths:` filter: a required check that never runs would block the merge.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.13.1  # keep in sync with data.yml
      - run: make cv
      # index.html's static rows must match data/ and cv/cv.json (run `make html`)
      - uses: astral-sh/setup-uv@v6
      - run: make html && git diff --exit-code index.html
