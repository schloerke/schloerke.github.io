# Epics: big pieces of work inside a package, listed under its row in the package table.
# Keyed by [[<lang>.<package name>]], the same lang and name as data/packages.json.
#   match: regex (case-insensitive) against the titles of my merged PRs in the package's repo
#   since / until (optional, "YYYY-MM"): ignore matching PRs outside these months
# The dates and PR count shown come from the matching PRs.

[[Python.shiny]]
title = "UI components from bslib"
about = "Ported sidebars, cards, accordions, value boxes, tooltips, and popovers from R's bslib."
match = 'sidebar|accordion|\bcards?\b|value.?box|tooltip|popover|experimental|navset|bslib|bs5|bootstrap'
until = "2024-01"

[[Python.shiny]]
title = "Playwright testing"
about = "shiny.playwright controllers for every UI component, and the shiny.pytest plugin."
match = 'playwright|e2e|pytest'
until = "2024-07"

[[Python.shiny]]
title = "Output renderers"
about = "shiny.render.renderer, a base class for writing your own output renderers."
match = 'renderer'
until = "2024-02"
since = "2023-12"

[[Python.shiny]]
title = "Data frames"
about = "render.data_frame with editing, selection, sorting, filtering, and styles."
match = 'data.?frame|\bdf\b|data.?grid'
since = "2023-12"
until = "2024-10"

[[Python.shiny]]
title = "Bookmarking"
about = "Save and restore an app's state in the URL or on the server."
match = 'bookmark'
until = "2025-04"

[[Python.shiny]]
title = "OpenTelemetry"
about = "Traces and logs for sessions, reactivity, and outputs."
match = 'otel|opentelemetry'

[[Python.shiny]]
title = "Test mode"
about = "test_server() and exported test values for fast tests without a browser."
match = 'test.?mode|testserver|test_server|AppTestValues|local_server'

[[Python.shiny]]
title = "Agent Skills"
about = "Skills shipped in the package so coding agents know how to write Shiny apps."
match = 'agent skill|shiny skills|docs\(skills\)'

[[R.shiny]]
