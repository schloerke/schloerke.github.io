# Epics: big pieces of work inside a package, listed under its row in the package table.
# Keyed by [[<lang>.<package name>]], the same lang and name as data/packages.json.
#   match: regex (case-insensitive) against the titles of my merged PRs in the package's repo
#   since / until (optional, "YYYY-MM"): ignore matching PRs outside these months
# The dates and PR count shown come from the matching PRs.

[[Python.shiny]]
title = "UI components from bslib"
about = "Ported sidebars, cards, accordions, value boxes, tooltips, and popovers from R's bslib."
match = 'sidebar|accordion|\bcards?\b|value.?box|tooltip|popover|experimental|navset|bslib|bs5|bootstrap'
until = "2024-01"

[[Python.shiny]]
title = "Playwright testing"
about = "shiny.playwright controllers for every UI component, and the shiny.pytest plugin."
match = 'playwright|e2e|pytest'
until = "2024-07"

